name: tidy-up-your-thoughts
version: 0.9.0
description: "Tidy Up Your Thoughts — five bundled skills that take an unstructured pile to a written conclusion, and a sixth that tests whether a text was understood. tidy-up-your-thoughts:brainstorming asks Socratic questions at the abstract layer and records every exchange to ~/thoughts/<topic_name>/; tidy-up-your-thoughts:refine dispatches read-only subagents, one lens each (steelman, mechanism, premise audit, failure mode), verifies each return against the summary, merges by decision point, then asks the user one situation at a time and records his answers; tidy-up-your-thoughts:visualize draws the summary as rendered mermaid diagrams, with a correction loop that amends the summary rather than the picture; tidy-up-your-thoughts:tidy writes report.md — topic sentence first, declarative throughout, negation only inside a rebuttal that builds the counter-argument in full, and domain terms verified against the instrument that defines them. tidy-up-your-thoughts:report is the meta skill, used when the process itself misfired — it traces the incident to the guideline that produced it, extracts one abstract anti-pattern, and applies exactly one class of fix (prompt, information, code, or process) in the same session. tidy-up-your-thoughts:diagnose is the second entry point: it takes a text, extracts three to seven load-bearing concepts, and asks one diagnostic question at a time until each concept's status is known, every verdict naming the section of source.md it quotes — because the model's recollection of a field is not evidence about the text in front of it."
